# SomnoScope default configuration.
# Every value here is also a CLI flag; the file exists so a run is reproducible
# from one artefact.

data:
  root: data/sleep-edf          # where scripts/download_sleepedf.sh puts things
  channel: Fpz-Cz               # single-channel EEG, as a wearable would have
  epoch_seconds: 30             # AASM scoring epoch
  crop_margin_min: 30           # minutes of Wake kept around the sleep period.
                                # Sleep Cassette nights are ~20 h and >60% Wake;
                                # without this, accuracy stops measuring anything.

model:
  sampling_rate: 100            # Sleep-EDF Fpz-Cz native rate
  n_classes: 5                  # W, N1, N2, N3, REM
  pool_out: 4
  head_dropout: 0.5
  fine:                         # spindle stream: 11-16 Hz events, 0.5-2 s long
    kernel_seconds: 0.5
    stride_seconds: 0.0625
    n_filters: 64
    n_blocks: 3
    block_kernel: 7
    first_pool: 8
    block_pool: 4
    dropout: 0.3
  coarse:                       # slow-wave stream: 0.5-2 Hz activity
    kernel_seconds: 4.0
    stride_seconds: 0.5
    n_filters: 64
    n_blocks: 3
    block_kernel: 7
    first_pool: 4
    block_pool: 2
    dropout: 0.3

train:
  epochs: 40
  batch_size: 128
  lr: 0.001
  weight_decay: 0.0001
  patience: 8
  seed: 0
  folds: 5
  norm: per_epoch               # per_epoch | global | none
                                # per_epoch z-scores each 30 s window, which is
                                # what closes the amplitude shortcut. Set to
                                # `global` to reproduce the vulnerable baseline.
  augment: true
  augment_severity: 0.35
  augment_kinds:                # amplitude_scale is excluded on purpose: it is
    - sensor_noise              # the held-out probe, and augmenting with it
    - motion_drift              # would make the probe uninformative.
    - bandwidth_loss

robustness:
  severities: [0.0, 0.25, 0.5, 0.75, 1.0]
  degradations:
    - amplitude_scale           # gain / impedance mismatch  <- shortcut probe
    - sensor_noise              # dry-electrode noise, 30 dB -> 0 dB SNR
    - motion_drift              # 0.05-0.5 Hz baseline wander
    - powerline_hum             # 50 Hz mains pickup
    - bandwidth_loss            # 45 Hz -> 8 Hz low-pass front end

explain:
  max_per_stage: 200
  correct_only: true            # audit what the model gets right, so a hit rate
                                # is about reasoning rather than error analysis
  bands:
    delta: [0.5, 4.0]
    theta: [4.0, 8.0]
    alpha: [8.0, 12.0]
    sigma: [12.0, 16.0]
    beta: [16.0, 30.0]
  expected_band:                # pre-registered: the band each AASM stage is
    W: alpha                    # clinically defined by. The audit scores the
    N1: theta                   # model's Grad-CAM attribution against this.
    N2: sigma
    N3: delta
    REM: theta

evaluation:
  human_kappa_floor: 0.75       # inter-scorer agreement band for 5-stage AASM
  human_kappa_ceiling: 0.80     # (Danker-Hopfe 2009; Rosenberg & Van Hout 2013)
  bootstrap: 500
